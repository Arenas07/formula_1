<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tarjeta Flip</title>
  <style>
    /* Copia los estilos relevantes desde tu CSS */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #d5d6d6;
      font-family: sans-serif;
    }

    .flip-box {
      background-color: transparent;
      width: 300px;
      height: 400px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-box-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .flip-box.flip .flip-box-inner {
      transform: rotateY(180deg);
    }

    .flip-box-front, .flip-box-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
    }

    .flip-box-front {
      background-color: #fff;
      color: #000;
    }

    .flip-box-back {
      background-color: #1e41ff;
      color: #fff;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

  <div class="flip-box" onclick="this.classList.toggle('flip')">
    <div class="flip-box-inner">
      <div class="flip-box-front">
        Frente de la tarjeta
      </div>
      <div class="flip-box-back">
        Reverso de la tarjeta
      </div>
    </div>
  </div>

</body>
</html>
