version: "3.9"

services:
  formula1-app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - formula1-mongodb
    environment:
      - MONGODB_URI=mongodb://formula1_user:formula1_password@formula1-mongodb:27017/formula1_db?authSource=admin
      - NODE_ENV=development
    volumes:
      - .:/home/app
      - /home/app/node_modules
    restart: on-failure

  formula1-mongodb:
    image: mongo:latest
    container_name: formula1-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=formula1_user
      - MONGO_INITDB_ROOT_PASSWORD=formula1_password
      - MONGO_INITDB_DATABASE=formula1_db
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    command: --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data: