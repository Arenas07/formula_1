<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../design/css/home.css">
    <script src="../utils/shared/navBarComponent.js" type="module" defer></script>
    <script src="../utils/shared/footerRights.js" type="module" defer></script>
</head>
<body>
    <custom-navbar></custom-navbar>

    <main>
        <div class="home-container">
            <div class="home-content">
                <p class="deco-actual-year">2025</p>
                <h2>SIENTE LA <span class="colored-p">VELOCIDAD</span></h2>
                <h3>Toda la emocion de la formula 1</h3>
                <div class="home-button">
                    <button><a href="https://youtu.be/mXZJQHnKmy0?si=1-lP993vM84ioRjw">Ver ultima carrera   ></a></button>
                </div>
            </div>
            <div class="home-video">
                <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/iwB0_lview4?autoplay=1&mute=1"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <section class="best-pilots">
                <h2>Pilotos destacados</h2>
                <div class="carrousel">
                    <div class="pilot-card">
                        <img src="../design/icons/outstanding-pilot-1.webp" alt="">
                        <div class="pilot-info">
                            <h3 class="pilot-name">Max Verstappen</h3>
                            <h3 class="pilot-team">Red bull racing</h3>
                        </div>
                        <div class="top">
                            <p>1</p>
                        </div>
                    </div>
                    <div class="pilot-card">
                        <img src="../design/icons/outstanding-pilot-2.jpg" alt="">
                        <div class="pilot-info">
                            <h3 class="pilot-name">Charles Leclerc</h3>
                            <h3 class="pilot-team">Ferrari</h3>
                        </div>
                        <div class="top">
                            <p>2</p>
                        </div>
                    </div>
                    <div class="pilot-card">
                        <img src="../design/icons/outstanding-pilot-3.jpg" alt="">
                        <div class="pilot-info">
                            <h3 class="pilot-name">Lando Norris</h3>
                            <h3 class="pilot-team">McLaren</h3>
                        </div>
                        <div class="top">
                            <p>3</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <custom-footer></custom-footer>
</body>
</html>
