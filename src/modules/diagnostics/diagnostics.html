<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico del Sistema - Fórmula 1</title>
    <link rel="stylesheet" href="../../design/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        .diagnostics-container {
            padding: 20px;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .back-button:hover {
            background-color: #1e40af;
        }
    </style>
    <script type="module">
        import '../../utils/diagnostics/diagnosticsView.js';
    </script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/">
                    <img src="../../design/img/formula1_logo.svg" alt="Formula 1 Logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/src/modules/drivers/driverView.html">Pilotos</a></li>
                <li><a href="/src/modules/teams/teamView.html">Equipos</a></li>
                <li><a href="/src/modules/vehicles/vehiclesView.html">Vehículos</a></li>
                <li><a href="/src/modules/circuits/circuitsView.html">Circuitos</a></li>
                <li id="login-link"><a href="/login.html">Iniciar Sesión</a></li>
                <li id="logout-link" style="display: none;"><a href="#" id="logout-button">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="diagnostics-container">
        <a href="/" class="back-button">← Volver al Inicio</a>
        
        <diagnostic-view></diagnostic-view>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Formula 1</h3>
                <p>© 2023 Formula 1. Todos los derechos reservados.</p>
            </div>
            <div class="footer-section">
                <h3>Enlaces</h3>
                <ul>
                    <li><a href="/">Inicio</a></li>
                    <li><a href="/src/modules/drivers/driverView.html">Pilotos</a></li>
                    <li><a href="/src/modules/teams/teamView.html">Equipos</a></li>
                    <li><a href="/src/modules/vehicles/vehiclesView.html">Vehículos</a></li>
                    <li><a href="/src/modules/circuits/circuitsView.html">Circuitos</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Diagnóstico</h3>
                <ul>
                    <li><a href="/src/modules/diagnostics/diagnostics.html">Herramienta de Diagnóstico</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script>
        // Verificar autenticación para mostrar/ocultar enlaces de login/logout
        document.addEventListener('DOMContentLoaded', function() {
            const loginLink = document.getElementById('login-link');
            const logoutLink = document.getElementById('logout-link');
            const logoutButton = document.getElementById('logout-button');
            
            // Verificar si hay token
            const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
            
            if (token) {
                loginLink.style.display = 'none';
                logoutLink.style.display = 'block';
            } else {
                loginLink.style.display = 'block';
                logoutLink.style.display = 'none';
            }
            
            // Manejar cierre de sesión
            logoutButton.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user');
                window.location.href = '/';
            });
        });
    </script>
</body>
</html>
